<div class="layout-topbar">
    <a class="app-logo" routerLink="/">
        <img alt="app logo" [src]="logo()" />
        <span class="app-name">Dapper RH</span>
    </a>

    <button #menubutton class="topbar-menubutton p-link cursor-pointer" type="button" (click)="onMenuButtonClick()">
        <span></span>
    </button>
    <ul class="topbar-menu">
        @for (item of tabs(); track item.routerLink; let i = $index) {
        <li>
            <a [routerLink]="item.routerLink" routerLinkActive="active-route"
                [routerLinkActiveOptions]="item.routerLinkActiveOptions || { paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
                [fragment]="item.fragment" [queryParamsHandling]="item.queryParamsHandling"
                [preserveFragment]="item.preserveFragment!" [skipLocationChange]="item.skipLocationChange!"
                [replaceUrl]="item.replaceUrl!" [state]="item.state" [queryParams]="item.queryParams">
                <span>{{ item.label }}</span>
            </a>
            <i class="pi pi-times" (click)="removeTab($event, i)"></i>
        </li>
        }
        @if (tabs().length === 0) {
        <li class="topbar-menu-empty">Sistema de vacaciones y asistencia</li>
        }
    </ul>

    <div class="topbar-actions">
        <!-- <p-button icon="pi pi-palette" rounded severity="contrast" (onClick)="onConfigButtonClick()"></p-button> -->
        <p-button [icon]="themeIcon()" [rounded]="true" severity="secondary" [outlined]="true" (onClick)="toggleTheme()"></p-button>

        <div class="topbar-search" [ngClass]="{ 'topbar-search-active': searchActive() }">
            <button pButton [rounded]="true" severity="secondary" type="button" icon="pi pi-search"
                (click)="activateSearch()"></button>

            <div class="search-input-wrapper">
                <p-icon-field>
                    <input #searchinput type="text" pInputText placeholder="Search" (blur)="deactivateSearch()"
                        (keydown.escape)="deactivateSearch()" />
                    <p-inputicon class="pi pi-search" />
                </p-icon-field>
            </div>
        </div>

        <p-select [(ngModel)]="selectedRole" [options]="roleContext.roles" optionLabel="label" optionValue="value" appendTo="body" styleClass="w-48 hidden md:flex"></p-select>

        <div class="topbar-profile">
            <button class="topbar-profile-button" type="button" pStyleClass="@next" enterFromClass="hidden"
                enterActiveClass="animate-scalein" leaveToClass="hidden" leaveActiveClass="animate-fadeout"
                [hideOnOutsideClick]="true">
                <img alt="avatar" src="/layout/images/avatar.png" />
                <span class="profile-details">
                    <span class="profile-name">Usuario demo</span>
                    <span class="profile-job">{{ roleContext.currentRoleLabel() }}</span>
                </span>
                <i class="pi pi-angle-down"></i>
            </button>
            <ul
                class="list-none hidden p-2 sm:p-4 m-0 rounded-border shadow absolute bg-surface-0 dark:bg-surface-900 origin-top w-48 mt-2 right-0 top-auto">
                <li class="flex items-start flex-col">
                    <a pRipple
                        class="flex p-2 rounded-border w-full items-center hover:bg-emphasis transition-colors duration-150 cursor-pointer">
                        <i class="pi pi-user mr-4"></i>
                        <span>Profile</span>
                    </a>
                    <a pRipple
                        class="flex p-2 rounded-border w-full items-center hover:bg-emphasis transition-colors duration-150 cursor-pointer">
                        <i class="pi pi-inbox mr-4"></i>
                        <span>Inbox</span>
                    </a>
                    <a pRipple
                        class="flex p-2 rounded-border w-full items-center hover:bg-emphasis transition-colors duration-150 cursor-pointer">
                        <i class="pi pi-cog mr-4"></i>
                        <span>Settings</span>
                    </a>
                    <a pRipple
                        class="flex p-2 rounded-border w-full items-center hover:bg-emphasis transition-colors duration-150 cursor-pointer">
                        <i class="pi pi-power-off mr-4"></i>
                        <span>Sign Out</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
