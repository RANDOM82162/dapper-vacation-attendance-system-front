<div class="bg-surface-100 dark:bg-surface-950 min-h-screen w-screen flex items-center justify-center p-4">
    <div class="bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12 shadow flex flex-col w-full max-w-md rounded-xl">
        <h1 class="font-bold text-2xl mt-0 mb-2">Recuperar contraseña</h1>
        <p class="text-muted-color mb-6">Escribe el correo de tu cuenta. Firebase enviará un enlace para crear una contraseña nueva.</p>

        @if (sent()) {
            <p class="mb-6 text-green-700 dark:text-green-300" role="status">Si existe una cuenta con ese correo, recibirás un enlace de recuperación.</p>
        } @else {
            <label for="recoveryEmail" class="font-medium mb-2">Correo electrónico</label>
            <input id="recoveryEmail" pInputText type="email" class="w-full mb-4" [(ngModel)]="email" autocomplete="email" (keydown.enter)="sendResetEmail()" />
            @if (errorMessage()) {
                <p class="text-red-600 dark:text-red-300 mb-4" role="alert">{{ errorMessage() }}</p>
            }
            <p-button label="Enviar enlace" styleClass="w-full" [loading]="sending()" (onClick)="sendResetEmail()"></p-button>
        }

        <a routerLink="/auth/login" class="mt-6 text-primary font-medium no-underline">Volver a iniciar sesión</a>
    </div>
</div>
