<div class="bg-surface-100 dark:bg-surface-950 h-screen w-screen flex items-center justify-center">
    <div class="bg-surface-0 dark:bg-surface-900 py-16 px-8 sm:px-16 shadow flex flex-col w-11/12 sm:w-120"
        style="border-radius: 14px">
        <img [src]="brandLogo()" alt="Dapper" class="mb-6 self-center w-24 h-24 object-contain" />
        <h1 class="text-2xl font-semibold text-center mt-0 mb-2">Iniciar sesión</h1>
        <p class="text-muted-color text-center mb-6">Sistema de vacaciones y asistencia</p>

        <p-iconfield class="mb-6">
            <p-inputicon class="pi pi-user" />
            <input pInputText type="email" placeholder="Correo" class="w-full" [(ngModel)]="email" autocomplete="email" (keydown.enter)="signIn()" />
        </p-iconfield>

        <p-iconfield class="mb-6">
            <p-inputicon class="pi pi-key" />
            <input pInputText type="password" placeholder="Contraseña" class="w-full" [(ngModel)]="password" autocomplete="current-password" (keydown.enter)="signIn()" />
        </p-iconfield>

        @if (errorMessage()) {
            <div class="mb-4 p-3 rounded-lg border border-red-200 bg-red-50 text-red-700 dark:border-red-900 dark:bg-red-950/30 dark:text-red-200">
                {{ errorMessage() }}
            </div>
        }

        <p-button label="Entrar" styleClass="w-full" [loading]="loading()" [disabled]="!email || !password" (onClick)="signIn()"></p-button>
        <a routerLink="/auth/forgotpassword" class="mt-5 text-primary font-medium no-underline text-center">¿Olvidaste tu contraseña?</a>
    </div>
</div>
